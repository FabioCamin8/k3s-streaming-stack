#cloud-config
# This file is vendor-data only. Proxmox generates hostname, user, SSH keys,
# DHCP networking, and DNS in the instance-specific Cloud-Init data.
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - bind9-dnsutils
  - git
  - iproute2
  - iputils-ping
  - jq
  - qemu-guest-agent
  - sudo
write_files:
  - path: /etc/ssh/sshd_config.d/99-k3s-streaming-stack-hardening.conf
    owner: root:root
    permissions: '0644'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
runcmd:
  - [sshd, -t]
  - [systemctl, enable, --now, qemu-guest-agent]
  - [systemctl, restart, ssh]
