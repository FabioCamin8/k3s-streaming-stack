apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remux
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - __REMUX_HOST__
      secretName: remux-tls
  rules:
    - host: __REMUX_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: remux
                port:
                  name: http
