apiVersion: v1
kind: Secret
metadata:
  name: aiostreams-bootstrap
type: Opaque
data:
  BASE_URL: __AIOSTREAMS_BASE_URL_B64__
  SECRET_KEY: __AIOSTREAMS_SECRET_KEY_B64__
  AIOSTREAMS_AUTH: __AIOSTREAMS_AUTH_B64__
  TRUSTED_IPS: __AIOSTREAMS_TRUSTED_IPS_B64__
  AIOSTREAMS_OIDC_CLIENT_SECRET: __AIOSTREAMS_OIDC_CLIENT_SECRET_B64__
stringData:
  DATABASE_URI: "sqlite://./data/db.sqlite"
  PORT: "3000"
  NODE_ENV: "production"
  AIOSTREAMS_AUTH_REQUIRED: "true"
  AIOSTREAMS_OIDC_ENABLED: "true"
  AIOSTREAMS_OIDC_ISSUER: "__AIOSTREAMS_OIDC_ISSUER__"
  AIOSTREAMS_OIDC_CLIENT_ID: "aiostreams"
  AIOSTREAMS_OIDC_SCOPES: "openid profile email groups"
  AIOSTREAMS_OIDC_USERNAME_CLAIM: "preferred_username"
  AIOSTREAMS_OIDC_GROUPS_CLAIM: "groups"
  AIOSTREAMS_OIDC_GROUP_PERMISSIONS: "admins=admin"
  AIOSTREAMS_OIDC_DEFAULT_PERMISSIONS: ""
  AIOSTREAMS_OIDC_USERNAME_PREFIX: "sso:"
  AIOSTREAMS_OIDC_LINK_BY_USERNAME: "false"
  AIOSTREAMS_OIDC_ALLOW_LOCAL_LOGIN: "true"
  AIOSTREAMS_OIDC_AUTO_REDIRECT: "false"
  AIOSTREAMS_OIDC_ALLOW_INSECURE_REQUESTS: "false"
  SETTINGS_REFRESH_INTERVAL: "0"
  EXPOSE_USER_COUNT: "false"
