server:
  address: 'tcp://:9091/'
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'

log:
  level: 'info'

authentication_backend:
  file:
    path: '/etc/authelia-users/users_database.yml'
    watch: false
    search:
      email: false
      case_insensitive: false
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: 'deny'
  rules:
    - domain: '__REMUX_HOST__'
      resources:
        - '^/admin(?:/.*)?$'
      policy: 'two_factor'

session:
  name: 'authelia_session'
  same_site: 'lax'
  inactivity: '1h'
  expiration: '8h'
  remember_me: '30d'
  secret: '{{ secret "/run/authelia-secrets/SESSION_SECRET" }}'
  cookies:
    - domain: '__AUTHELIA_COOKIE_DOMAIN__'
      authelia_url: 'https://__AUTHELIA_HOST__'
      default_redirection_url: '__AIOSTREAMS_BASE_URL__'

regulation:
  max_retries: 3
  find_time: '2m'
  ban_time: '5m'

storage:
  encryption_key: '{{ secret "/run/authelia-secrets/STORAGE_ENCRYPTION_KEY" }}'
  local:
    path: '/config/db.sqlite3'

notifier:
  disable_startup_check: false
  filesystem:
    filename: '/config/notification.txt'

identity_validation:
  reset_password:
    jwt_secret: '{{ secret "/run/authelia-secrets/IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET" }}'

totp:
  disable: false
  issuer: '__AUTHELIA_HOST__'
  algorithm: 'sha1'
  digits: 6
  period: 30
  skew: 1

webauthn:
  disable: true

identity_providers:
  oidc:
    hmac_secret: '{{ secret "/run/authelia-secrets/OIDC_HMAC_SECRET" }}'
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/run/authelia-secrets/OIDC_ISSUER_PRIVATE_KEY" | mindent 10 "|" | msquote }}
    clients:
      - client_id: 'aiostreams'
        client_name: 'AIOStreams'
        client_secret: '{{ secret "/run/authelia-secrets/AIOSTREAMS_OIDC_CLIENT_SECRET_HASH" }}'
        public: false
        authorization_policy: 'two_factor'
        require_pkce: true
        pkce_challenge_method: 'S256'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 month'
        redirect_uris:
          - '__AIOSTREAMS_BASE_URL__/api/v1/auth/oidc/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        id_token_signed_response_alg: 'RS256'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
